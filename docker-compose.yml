# FiniexCorpusEngine as a service that is always on: the librarian (the MCP search server over HTTP) and the diagnostics
# view, each started again by Docker whenever Docker starts, until it is stopped by hand.
#
#   docker compose up -d --build     # build the image once, start both
#   docker compose logs -f librarian # what the server says
#   docker compose down              # stop both
#
# Both listen on 127.0.0.1 alone. A container of the app park (the testing IDE) reaches the librarian as
# host.docker.internal:8765/mcp, with the bearer token in .env. The repository is mounted, so the data folders the
# configuration names (_data, _sources, _work, corpus/index, logs) and .env are this machine's own.
services:
  librarian:
    build: .
    image: finiex-corpus-engine
    container_name: finiex-corpus-librarian
    command: python -m backend.search.search_server --http 8765 --host 0.0.0.0
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false
    environment:
      - DIAGNOSTICS_VIEW_URL=http://127.0.0.1:8021
      # the index database inside the Compose network (issue #10); read where database.librarian_reads says so
      - CORPUS_DB_HOST=postgres
      - CORPUS_DB_PORT=5432
    depends_on:
      - postgres
    restart: unless-stopped

  diagnostics:
    image: finiex-corpus-engine
    container_name: finiex-corpus-diagnostics
    command: python -m backend.diagnostics --port 8021 --host 0.0.0.0 --allow-verdicts
    ports:
      - "127.0.0.1:8021:8021"
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false
    environment:
      - DIAGNOSTICS_VIEW_URL=http://127.0.0.1:8021
      # the view's Librarian page calls the running librarian over MCP, as a client does (L1.a)
      - LIBRARIAN_URL=http://librarian:8765/mcp
      - CORPUS_DB_HOST=postgres
      - CORPUS_DB_PORT=5432
    depends_on:
      - librarian
    restart: unless-stopped

  # The index database (issue #10): PostgreSQL with pgvector, the image the app park's RAG engine runs. It holds derived
  # data only (pages, postings, chunk vectors), rebuilt from the readings; its schema is written by
  # `python -m backend.database.migrate`. The password is CORPUS_DB_PASSWORD in .env (.env.example names it), taken by
  # interpolation alone: a foreign image never gets the whole .env and its keys. Without it this service alone does not
  # start, and the others still do.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finiex-corpus-postgres
    command: postgres -c maintenance_work_mem=1GB -c shared_buffers=512MB
    shm_size: 1g
    environment:
      - POSTGRES_USER=corpusengine
      - POSTGRES_PASSWORD=${CORPUS_DB_PASSWORD:-}
      - POSTGRES_DB=corpusengine
    volumes:
      - corpus_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    restart: unless-stopped

  # A browser view of the database for development (http://127.0.0.1:5051), as the RAG engine has; the server is
  # registered from docker/pgadmin_servers.json, its password asked on the first connect.
  pgadmin:
    image: dpage/pgadmin4
    container_name: finiex-corpus-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@local.dev
      - PGADMIN_DEFAULT_PASSWORD=${CORPUS_PGADMIN_PASSWORD:-admin}
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
      - PGADMIN_SERVER_JSON_FILE=/pgadmin4/servers.json
    volumes:
      - corpus_pgadmin:/var/lib/pgadmin
      - ./docker/pgadmin_servers.json:/pgadmin4/servers.json:ro
    ports:
      - "127.0.0.1:5051:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  corpus_pgdata:
  corpus_pgadmin:
