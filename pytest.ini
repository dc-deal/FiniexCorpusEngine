[pytest]
testpaths = tests
pythonpath = src
# The default run is offline, free and fast. Two kinds of test run only when asked for:
#   pytest -m live    reaches the network or spends API budget
#   pytest -m slow    reads a whole OpenStax book (about 3 minutes); run it before a commit
#   pytest -m release the licensed-material check of the whole repository and its history; run it before every release
addopts = -m "not live and not slow and not release"
markers =
    live: reaches the network or spends API budget; run explicitly with -m live
    corpus: needs the downloaded files in _data/corpus/raw/ (python -m backend.ingestion.acquire)
    readings: needs the page readings in _data/corpus/readings/ (the local data folder)
    results: needs the measurements in _data/evaluation/results/ (the local data folder)
    database: needs the index database running (docker compose up -d postgres); works in a database of its own, dropped after
    slow: reads a whole book with table detection; run with -m slow
    release: the licensed-material check before every release (names in every tracked file and in the history); -m release
